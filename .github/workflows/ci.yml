name: CI/CD - Build, Lint, Sonar, Docker, Trivy, Release & Deploy

# Esteira por nível de confiança da branch (modelo da aula):
#   dev/PR  -> CI (Build, Lint, Sonar) + validação de build Docker
#   staging -> Entrega Contínua: Release Docker Hub + Trivy + Deploy EC2
#   main    -> Implantação Contínua: Release + Deploy em produção (EC2)
on:
  push:
    branches: ["dev", "staging", "main"]
  pull_request:
    branches: ["dev", "staging", "main"]

jobs:
  # ==========================================================================
  # CI — roda em todas as branches/PRs (Fail Fast com `needs`)
  # ==========================================================================
  build:
    name: Build (sintaxe + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint (ESLint)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
      - run: npm run lint

  test_sonar:
    name: Test + SonarQube
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
      - run: npm test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================================================
  # #03 — VALIDAÇÃO DE BUILD DOCKER — em todo push/PR (impede merge se quebrar)
  # ==========================================================================
  docker_build:
    name: Validação de Build Docker
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar que a imagem Docker constrói
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: marmitatech-pro:ci

  # ==========================================================================
  # RELEASE — Build & Push Docker Hub (push em staging ou main)
  # ==========================================================================
  release_docker:
    name: Release - Build & Push Docker Hub
    needs: [test_sonar, docker_build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_latest: ${{ steps.meta.outputs.image_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tags da imagem (SemVer-friendly)
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/devops"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=$IMAGE:$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image_latest=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # TRIVY → SONAR EXTERNAL ISSUES — varredura de CVE na imagem (staging/main)
  # ==========================================================================
  trivy_sonar:
    name: Trivy Scan → Sonar External Issues
    needs: release_docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login no Docker Hub (para o Trivy puxar a imagem)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy scan (relatório JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops:latest
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Resumo de CVEs encontrados (Shift-Left)
        run: |
          echo "===== TRIVY: vulnerabilidades na imagem ====="
          TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          echo "Total de CVEs (CRITICAL/HIGH/MEDIUM): ${TOTAL:-0}"
          jq -r '.Results[]?.Vulnerabilities // [] | .[] | "  \(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion)"' trivy-report.json | sort -u | head -50 || true

      # Converte o JSON do Trivy para o Generic Issue Format do SonarQube.
      # (Substitui o antigo template @/contrib/sonarqube.tpl, removido do Trivy upstream.)
      - name: Converter relatório Trivy → formato Sonar (Generic Issues)
        run: |
          jq '{
            rules: ([.Results[]?.Vulnerabilities // [] | .[] | {
              id: .VulnerabilityID,
              name: .VulnerabilityID,
              description: (.Title // .VulnerabilityID),
              engineId: "Trivy",
              cleanCodeAttribute: "TRUSTWORTHY",
              impacts: [{
                softwareQuality: "SECURITY",
                severity: (if .Severity == "CRITICAL" or .Severity == "HIGH" then "HIGH" elif .Severity == "MEDIUM" then "MEDIUM" else "LOW" end)
              }]
            }] | unique_by(.id)),
            issues: [.Results[]?.Vulnerabilities // [] | .[] | {
              ruleId: .VulnerabilityID,
              primaryLocation: {
                message: "\(.VulnerabilityID) — \(.PkgName) \(.InstalledVersion): \(.Title // "vulnerabilidade conhecida") [\(.Severity)]",
                filePath: "Dockerfile",
                textRange: {startLine: 1}
              }
            }]
          }' trivy-report.json > trivy-sonar.json
          echo "Issues geradas para o Sonar: $(jq '.issues | length' trivy-sonar.json)"

      - name: SonarQube Scan (External Issues do Trivy)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.externalIssuesReportPaths=trivy-sonar.json

      - name: Upload do relatório Trivy (artefato de auditoria)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-sonar.json

  # ==========================================================================
  # DEPLOY na EC2 via SSH/SCP — Entrega/Implantação Contínua (staging/main)
  # ==========================================================================
  deploy:
    name: Deploy na EC2 (SSH/SCP)
    needs: [release_docker, trivy_sonar]
    # SEGURO POR PADRÃO: o deploy só roda se o feature flag estiver explicitamente ligado.
    # Para ativar o deploy ao vivo: defina a variável de repositório ENABLE_EC2_DEPLOY=true
    # (Settings > Secrets and variables > Actions > Variables) + os secrets EC2_HOST/EC2_USER.
    if: >
      vars.ENABLE_EC2_DEPLOY == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se os secrets da EC2 estão configurados
        id: gate
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_USER }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Secrets da EC2 presentes — deploy habilitado."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2_HOST/EC2_USER não configurados — deploy pulado. Adicione os secrets e re-execute este job para publicar na EC2."
          fi

      - name: Copiar arquivos de deploy para a EC2 (SCP)
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,scripts/migrate.sql,init.sql"
          target: "~/danielodadevops"

      - name: Deploy remoto (SSH → pull + up)
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/danielodadevops

            # .env de produção (segredos injetados pelo GitHub)
            cat > .env <<EOF
            APP_CONTAINER_NAME=danielodadevops
            APP_PORT=8081
            APP_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/devops:latest
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            EOF

            # rede compartilhada da turma (idempotente)
            sudo docker network create rede_alunos 2>/dev/null || true

            # Executa o schema no container MySQL antes de subir a aplicação (igual ao esqueleto)
            echo "⏳ Aplicando schema em mysql-infra..."
            sudo docker exec -i mysql-infra mysql -u"${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASS }}" < scripts/migrate.sql
            echo "✅ Schema aplicado com sucesso!"

            # baixa a imagem nova do registry e sobe (imutabilidade)
            sudo docker compose pull
            sudo docker compose up -d

            echo "Deploy concluído. Containers:"
            sudo docker compose ps
